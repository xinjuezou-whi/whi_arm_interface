chin_arm:
  controllers:
    # when starting the controller or canceling a trajectory, position hold mode is entered
    # this parameter specifies the time it takes to bring the current state (position and velocity) to a stop
    # if zero, the controller stops at the actual position
    stop_trajectory_duration: 0.5 # sec
    state:
      type: joint_state_controller/JointStateController
      publish_rate: 50
    command:
      # position_controllers/JointTrajectoryController
      # pos_vel_controllers/JointTrajectoryController
      # pos_vel_acc_controllers/JointTrajectoryController
      type: position_controllers/JointTrajectoryController
      joints:
        - chin_joint_1
        - chin_joint_3
        - chin_joint_6
        - chin_joint_9
        - chin_joint_11
        - chin_joint_13
      constraints:
        # if zero, the executing duration would be decided by the start and end time of planned trajectory
        goal_time: 0.5 # 0.5 sec
        stopped_velocity_tolerance: 0.3 # 0.01 rad/s
        chin_joint_1:
          trajectory: 0.5 # 0.5 rad
          goal: 0.3 # 0.02 rad
        chin_joint_3:
          trajectory: 1.0 #1.0
          goal: 0.6 #0.65
        chin_joint_6:
          trajectory: 1.5 #1.5
          goal: 1.0 #1.0
        chin_joint_9:
          trajectory: 1.5
          goal: 1.0
        chin_joint_11:
          trajectory: 1.55 #1.5
          goal: 1.5 #0.8
        chin_joint_13:
          trajectory: 0.5
          goal: 0.25 #0.2
