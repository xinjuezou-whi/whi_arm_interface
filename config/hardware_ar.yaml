  forward_dirs: [1, 1, 1, -1, 1, 1]
  limits_dirs: [-1, -1, 1, 1, -1, 1]
  home_offsets: [160, 41, -149, 78.5, 91.5, -163]
  home_kinematics: [50, 5, 25, 5, 25] # order speed_rate-acc_dur-acc_rate-dcc_dur-dcc_rate
