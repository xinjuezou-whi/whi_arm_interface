whi_arm_interface:
  joints: &robot_joints
    - j1
    - j2
    - j3
    - j4
    - j5
    - j6

  controllers:
    state:
      type: joint_state_controller/JointStateController
      publish_rate: 50 # 50

    pos_controller:
      type: position_controllers/JointTrajectoryController
      joints: *robot_joints
      constraints:
        # if zero, the executing duration would be decided by the start and end time of planned trajectory
        # set it big enough especially for position controller
        goal_time: 1.0 # 0.5 sec
        stopped_velocity_tolerance: 0.05 # 0.01 rad/s
        j1: { trajectory: 0.2, goal: 0.1 }
        j2: { trajectory: 0.2, goal: 0.1 }
        j3: { trajectory: 0.2, goal: 0.1 }
        j4: { trajectory: 0.2, goal: 0.1 }
        j5: { trajectory: 0.2, goal: 0.1 }
        j6: { trajectory: 0.2, goal: 0.1 }
      # when starting the controller or canceling a trajectory, position hold mode is entered
      # this parameter specifies the time it takes to bring the current state (position and velocity) to a stop
      # if zero, the controller stops at the actual position
      stop_trajectory_duration: 1.0 # sec
      action_monitor_rate: 20

    scaled_pos_controller:
      type: position_controllers/ScaledJointTrajectoryController
      joints: *robot_joints
      constraints:
        # if zero, the executing duration would be decided by the start and end time of planned trajectory
        # set it big enough especially for position controller
        goal_time: 2.0 # 0.5 sec
        stopped_velocity_tolerance: 0.025 # 0.01 rad/s
        j1: { trajectory: 0.2, goal: 0.1 }
        j2: { trajectory: 0.2, goal: 0.1 }
        j3: { trajectory: 0.2, goal: 0.1 }
        j4: { trajectory: 0.2, goal: 0.1 }
        j5: { trajectory: 0.2, goal: 0.1 }
        j6: { trajectory: 0.2, goal: 0.1 }
      gains: # Required if controlling a velocity interface
        j1: {p: 100,  d: 1, i: 1, i_clamp: 1}
        j2: {p: 100,  d: 1, i: 1, i_clamp: 1}
        j3: {p: 100,  d: 1, i: 1, i_clamp: 1}
        j4: {p: 100,  d: 1, i: 1, i_clamp: 1}
        j5: {p: 100,  d: 1, i: 1, i_clamp: 1}
        j6: {p: 100,  d: 1, i: 1, i_clamp: 1}
      # when starting the controller or canceling a trajectory, position hold mode is entered
      # this parameter specifies the time it takes to bring the current state (position and velocity) to a stop
      # if zero, the controller stops at the actual position
      stop_trajectory_duration: 1.0 # sec
      action_monitor_rate: 20

